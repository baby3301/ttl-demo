   <script>
      let onRun = false;
      let onExport = false;
      const inputElement = document.getElementById('search');
      // const errorElement = document.getElementById('errorMessage');

      // const fullRegex = /^(P1|P2)-(0[5-30]|[1-2][0-30]|30)-(0[1-9]|[1-2][0-9]|30)[A-Z]?$/;
      // const partialRegex = /^P([12](-((0[5-9]|[1-2][0-9]|30)(-((0[1-9]|[1-2][0-9]|30)[A-Z]?|[0-3])?)?|[0-3])?)?)?$/;
      const fullRegex = /^[A-Z0-9]{2}-[A-Z0-9]{2}-[A-Z0-9]{2,3}$/;
      const partialRegex = /^([A-Z0-9]{1,2}|[A-Z0-9]{2}-[A-Z0-9]{0,2}|[A-Z0-9]{2}-[A-Z0-9]{2}-[A-Z0-9]{0,3})$/;

      inputElement.addEventListener('input', function(e) {
         let value = e.target.value.toUpperCase();
         const isDeleting = e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward';

         if (value === '') {
            e.target.dataset.oldValue = '';
            e.target.value = '';
            inputElement.style.borderColor = '';
            // errorElement.style.display = 'none';
            return;
         }

         if (!isDeleting) {
            if (/^[A-Z0-9]{2}$/.test(value)) {
               value += '-';
            } else if (/^[A-Z0-9]{2}-[A-Z0-9]{2}$/.test(value)) {
               value += '-';
            }
         }

         if (partialRegex.test(value)) {
            e.target.value = value;
            e.target.dataset.oldValue = value; 
         } else {
            value = e.target.dataset.oldValue || '';
            e.target.value = value;
         }

         if (fullRegex.test(value)) {
            document.getElementById('btn-search').disabled = false;
            document.getElementById('btn-export').disabled = false;
            inputElement.style.borderColor = 'green';
            // errorElement.style.display = 'none';
         } else {
            document.getElementById('btn-search').disabled = true;
            document.getElementById('btn-export').disabled = true;
            inputElement.style.borderColor = 'red';
            // errorElement.style.display = 'block';
         }
      });

      inputElement.addEventListener("keydown", function(event) {
         if (event.key === "Enter" && onRun == false) {
            let value = event.target.value.toUpperCase();

            const regex = /^(P1|P2)-(0[5-9]|[1-2][0-9]|30)-(0[1-9]|[1-2][0-9]|30)[A-Z]?$/;
            if (fullRegex.test(value)) {
               searchCode();
            }
         }
      });
   </script>
